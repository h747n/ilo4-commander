# Builds the Android app in the cloud - no Android SDK needed on your machine.
# Push this repo to GitHub, open Actions -> "Android APK" -> Run workflow,
# then download ilo-fans-apk from the finished run.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths: ["mobile/**", "web/icons/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: ilo-fans-apk
          path: mobile/dist/ilo-fans.apk
