# Builds the Android app in the cloud - no Android SDK needed on your machine.
# Every build is published as the "android-latest" release, so the newest APK
# is always at:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/ilo-fans.apk
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "web/icons/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write          # to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: ilo-fans-apk
          path: mobile/dist/ilo-fans.apk
      - name: Publish as the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/ilo-fans.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android app (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install on Android, then enter your panel's address (for example http://192.168.1.50:8080)."
